<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios | NovaSYS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="icon" href="../img/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="bg-light pt-0 m-0">

<div class="container-fluid p-0">
    <div class="row g-0">
        <aside class="col-md-2 d-none d-md-block sidebar p-0 vh-100 position-sticky top-0">
            <div class="p-4 text-center">
                <img src="../img/logo.png" width="50" class="mb-2 bg-white rounded-circle p-1" alt="Logo NovaSYS">
                <h5 id="txtNombreSidebar" class="text-white mb-0">Alumno</h5>
                <small class="text-white-50">Portal Académico</small>
            </div>
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="dashboard-alumno.html"><span class="material-symbols-outlined me-2">school</span> Mis Materias</a></li>
                <li class="nav-item"><a class="nav-link" href="calificaciones.html"><span class="material-symbols-outlined me-2">task_alt</span> Calificaciones</a></li>
                <li class="nav-item"><a class="nav-link active" href="horarios.html"><span class="material-symbols-outlined me-2">calendar_month</span> Horarios y Fechas</a></li>
            </ul>
        </aside>

        <main class="col-md-10 main-content p-0">
            <nav class="navbar-dashboard bg-white shadow-sm px-4 py-3 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill">
                        <span class="material-symbols-outlined fs-6 align-middle me-1">schedule</span> Cursada Presencial
                    </span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center gap-2 border-start ps-3">
                        <span class="material-symbols-outlined fs-3 text-secondary">account_circle</span>
                        <span id="navNombreAlumno" class="fw-bold small text-dark d-none d-sm-inline">Cargando...</span>
                    </div>
                    <button id="btnCerrarSesionTop" class="btn btn-outline-danger btn-sm rounded-pill fw-bold ms-2">Cerrar Portal</button>
                </div>
            </nav>

            <div class="p-4 p-md-5">
                <header class="mb-4">
                    <h1 class="h3 fw-bold mb-1">Horario Semanal</h1>
                    <p class="text-muted mb-0">Cursada de tus materias del ciclo lectivo <span id="txtCiclo">2025</span>.</p>
                </header>

                <div id="resumenHorario" class="row g-3 mb-4"></div>

                <div class="card card-dash p-4 bg-white shadow-sm border-0">
                    <div id="grillaHorario" class="table-responsive">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="text-muted mt-3 mb-0">Cargando tu horario...</p>
                        </div>
                    </div>
                </div>

                <div class="card card-dash p-4 bg-white shadow-sm border-0 mt-4">
                    <h2 class="h6 fw-bold mb-3">Tus materias</h2>
                    <div id="listaMaterias" class="row g-3"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module" src="../js/auth-guard.js"></script>
<script src="../js/notificaciones.js"></script>
<script src="../js/horarios.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
